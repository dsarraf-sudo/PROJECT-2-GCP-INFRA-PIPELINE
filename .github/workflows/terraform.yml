name: "GCP Terraform Deployment"

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  terraform:
    name: "Terraform Action"
    runs-on: ubuntu-latest
    
    # Connects to the Secrets you added in GitHub Settings
    env:
      GOOGLE_CREDENTIALS: ${{ secrets.GCP_SA_KEY }}
      GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      # --- 1. INITIALIZE ---
      - name: Terraform Init
        working-directory: ./environments/dev
        run: terraform init

      # --- 2. THE PLAN (Always runs) ---
      # This shows you what will happen without actually changing GCP yet.
      - name: Terraform Plan
        working-directory: ./environments/dev
        run: terraform plan -var="project_id=$GCP_PROJECT_ID"

      # --- 3. THE APPLY (Only runs on Main) ---
      # This "Gate" ensures that only code merged into 'main' actually builds resources.
      - name: Terraform Apply
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        working-directory: ./environments/dev
        run: terraform apply -auto-approve -var="project_id=$GCP_PROJECT_ID"
